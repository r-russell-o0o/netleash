<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f86f0"/>
      <stop offset="1" stop-color="#4b2fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="612" cy="612" r="232"/></clipPath>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#10073a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- globe: the internet -->
    <circle cx="612" cy="612" r="232" stroke-width="44" fill="#ffffff" fill-opacity="0.10"/>
    <g clip-path="url(#globe)" stroke-width="30" stroke-opacity="0.9">
      <ellipse cx="612" cy="612" rx="104" ry="232"/>
      <line x1="370" y1="612" x2="854" y2="612"/>
      <path d="M392 500 Q612 560 832 500"/>
      <path d="M392 724 Q612 664 832 724"/>
    </g>

    <!-- leash: handle loop and cord down to the globe -->
    <ellipse cx="278" cy="252" rx="96" ry="62" transform="rotate(38 278 252)" stroke-width="40"/>
    <path d="M354 311 C 374 372, 398 420, 448 456" stroke-width="40"/>
  </g>

  <!-- clasp where the leash meets the globe -->
  <g filter="url(#shadow)">
    <circle cx="452" cy="458" r="54" fill="#f5a04e" stroke="#ffffff" stroke-width="18"/>
    <circle cx="452" cy="458" r="16" fill="#ffffff"/>
  </g>
</svg>
