[package]
name = "netleash"
version = "0.1.0"
edition = "2024"
description = "Per-program network monitor, firewall and bandwidth limiter for Windows"
license = "MIT"
repository = "https://github.com/r-russell-o0o/netleash"
readme = "README.md"
# A Windows application, not a library: not for crates.io.
publish = false

[dependencies]
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Etw", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Rpc", "Win32_System_Time", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[profile.release]
strip = true

